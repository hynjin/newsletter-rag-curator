services:
  db:
    image: pgvector/pgvector:pg16
    container_name: newsletter-rag-curator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: newsletter
      POSTGRES_PASSWORD: newsletter
      POSTGRES_DB: newsletter_rag_curator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsletter -d newsletter_rag_curator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
